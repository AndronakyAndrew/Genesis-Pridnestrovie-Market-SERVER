# Изолированное development-окружение Genesis Market.
# Значения берутся из .env.dev (скопируй из .env.dev.example и заполни).
# Запуск: docker compose -f docker-compose.dev.yml up --build
#
# Все переменные подключены через env_file: (см. сервисы ниже), а не через
# ${...}-подстановку самого compose-файла — специально: ${...} в compose
# по умолчанию берёт значения из корневого .env (это ПРОД-секреты, см.
# docker-compose.yml), если забыть флаг --env-file. env_file: этой
# двусмысленности не имеет — сервис всегда получает ровно .env.dev,
# независимо от того, как вызван docker compose.

name: genesis-market-dev

# Ротация логов: json-file без лимита забивает диск (в dev — быстрее, `dotnet watch`
# и migrator многословны). 10 МБ x 3 файла на сервис.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Одноразовый прогон EF-миграций (создаёт схему приложения + qrtz_* для Quartz
  # persistent job store) перед стартом api — на чистом dev-volume Postgres таблиц ещё нет.
  migrator:
    container_name: genesis-migrator-dev
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    working_dir: /src
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    # .env.dev уже содержит GENESIS_DESIGN_CONNECTION в нужном для migrator виде.
    env_file:
      - .env.dev
    volumes:
      - .:/src
      - genesis-dev-nuget:/root/.nuget/packages
      - genesis-dev-dotnet-tools:/root/.dotnet/tools
      - genesis-dev-domain-bin:/src/src/GenesisMarket.Domain/bin
      - genesis-dev-domain-obj:/src/src/GenesisMarket.Domain/obj
      - genesis-dev-infra-bin:/src/src/GenesisMarket.Infrastructure/bin
      - genesis-dev-infra-obj:/src/src/GenesisMarket.Infrastructure/obj
      - genesis-dev-api-bin:/src/src/GenesisMarket.Api/bin
      - genesis-dev-api-obj:/src/src/GenesisMarket.Api/obj
    command: >
      sh -c "
      export PATH=\"$$PATH:/root/.dotnet/tools\";
      dotnet tool install --global dotnet-ef --version 10.0.0 || true;
      dotnet restore src/GenesisMarket.Api/GenesisMarket.Api.csproj;
      dotnet ef database update -p src/GenesisMarket.Infrastructure -s src/GenesisMarket.Api
      "
    networks:
      - genesis-dev

  api:
    container_name: genesis-api-dev
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    restart: unless-stopped
    logging: *default-logging
    working_dir: /src
    command: dotnet watch run --project src/GenesisMarket.Api/GenesisMarket.Api.csproj --no-launch-profile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    # Все переменные (включая Postgres__*/Minio__*/Jwt__Key под именами ASP.NET
    # Core) лежат прямо в .env.dev — без ${...} подстановки, см. комментарий
    # в начале файла и .env.dev.
    env_file:
      - .env.dev
    volumes:
      - .:/src
      - genesis-dev-nuget:/root/.nuget/packages
      - genesis-dev-domain-bin:/src/src/GenesisMarket.Domain/bin
      - genesis-dev-domain-obj:/src/src/GenesisMarket.Domain/obj
      - genesis-dev-infra-bin:/src/src/GenesisMarket.Infrastructure/bin
      - genesis-dev-infra-obj:/src/src/GenesisMarket.Infrastructure/obj
      - genesis-dev-api-bin:/src/src/GenesisMarket.Api/bin
      - genesis-dev-api-obj:/src/src/GenesisMarket.Api/obj
    ports:
      - "8091:8080"
    networks:
      - genesis-dev

  postgres:
    container_name: genesis-postgres-dev
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    # Официальный образ сам читает POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD —
    # имена в .env.dev совпадают дословно, отдельный environment: не нужен.
    env_file:
      - .env.dev
    volumes:
      - genesis-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      - genesis-dev

  minio:
    container_name: genesis-minio-dev
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    # MinIO сам читает MINIO_ROOT_USER/MINIO_ROOT_PASSWORD — имена совпадают с .env.dev.
    env_file:
      - .env.dev
    volumes:
      - genesis-dev-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9002:9000"
      - "9003:9001"
    networks:
      - genesis-dev

  adminer:
    container_name: genesis-adminer-dev
    image: adminer:5.4.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - genesis-dev

volumes:
  genesis-dev-postgres:
  genesis-dev-minio:
  genesis-dev-nuget:
  genesis-dev-dotnet-tools:
  # bin/obj — отдельные volumes на проект, а не часть bind-mount `.:/src`.
  # obj/*.nuget.g.props хранит абсолютный путь к NuGet-кэшу; если эти папки
  # синкать с хостом, сборка на Windows-хосте (dotnet build/ef вне контейнера)
  # прописывает туда Windows-путь — контейнер (Linux) после этого не находит
  # пакеты по этому пути и падает с NETSDK1064.
  genesis-dev-domain-bin:
  genesis-dev-domain-obj:
  genesis-dev-infra-bin:
  genesis-dev-infra-obj:
  genesis-dev-api-bin:
  genesis-dev-api-obj:

networks:
  genesis-dev:
    name: genesis-dev
    driver: bridge

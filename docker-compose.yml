# ============================================================
#  Genesis Market — локальная / VPS-инфраструктура.
#  Все секреты и ключи берутся из .env (см. .env.example).
#  В самом файле — ни одного значения секрета.
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      # Порт, который Kestrel слушает ВНУТРИ контейнера. По умолчанию 8080
      # (внутренняя сеть, с занятым на хосте 8080 не конфликтует).
      ASPNETCORE_HTTP_PORTS: ${ASPNETCORE_HTTP_PORTS:-8080}
      # Уровень логов Serilog из .env.
      Serilog__MinimumLevel__Default: ${LOG_LEVEL}
      # PostgreSQL.
      Postgres__Host: postgres
      Postgres__Port: "5432"
      Postgres__Database: ${POSTGRES_DB}
      Postgres__User: ${POSTGRES_USER}
      Postgres__Password: ${POSTGRES_PASSWORD}
      # MinIO.
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET}
      Minio__UseSsl: ${MINIO_USE_SSL}
      # JWT — ключ подписи ТОЛЬКО из окружения (в appsettings его нет).
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      # Ключ HMAC для хеширования IP (сырой IP в базе не хранится).
      Security__IpHashKey: ${IPHASH_KEY}
      # SMTP для писем подтверждения (пусто -> отправка в лог, dev).
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM:-no-reply@genesis-hq.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-Genesis Market}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      # Telegram-бот (уведомления/посты через outbox). Пусто -> dev-лог, доставка почтой.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__BroadcastChatId: ${TELEGRAM_BROADCAST_CHAT_ID}
      # Публичный адрес фронтенда для ссылок в постах канала.
      Telegram__WebBaseUrl: ${TELEGRAM_WEB_BASE_URL}
      # Маршрутизация «категория -> канал» задаётся переменными Telegram__CategoryChannels__<category>.
      # SEO: публичный адрес сайта для канонических ссылок, sitemap, og-тегов и JSON-LD.
      # Пусто -> SEO-эндпоинты отдают 503 (индексировать нечего). Обычно = адресу фронтенда.
      Seo__WebBaseUrl: ${SEO_WEB_BASE_URL}
      Seo__SiteName: ${SEO_SITE_NAME:-Genesis Market}
      # Что обязательно для публикации: None | Email | Phone | Both.
      Publishing__RequiredVerification: ${PUBLISHING_REQUIRED_VERIFICATION:-Email}
      # CORS — строка origin-ов через запятую.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      # Доверенные обратные прокси (Caddy как TLS-терминатор): без них RemoteIpAddress —
      # это адрес прокси, и rate-limit/журнал считали бы всех клиентов одним IP.
      # KnownNetworks — CIDR доверенных сетей (docker-мост), KnownProxies — конкретные IP.
      Network__KnownNetworks: ${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      Network__KnownProxies: ${TRUSTED_PROXY_IPS}
      Network__ForwardLimit: ${TRUSTED_PROXY_FORWARD_LIMIT:-1}
      # OpenTelemetry: адрес OTLP-коллектора. Пусто -> экспорт выключен (инструментация вхолостую).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    ports:
      # host:container. На хосте 8080 занят другим проектом → публикуем на 8090.
      - "${API_HOST_PORT:-8090}:${ASPNETCORE_HTTP_PORTS:-8080}"
    # ---- Hardening контейнера ----
    read_only: true                       # ФС только для чтения; писать — только в tmpfs ниже.
    tmpfs:
      - /tmp                              # .NET нужен только временный каталог.
    security_opt:
      - no-new-privileges:true            # процесс не может повысить привилегии (setuid и пр.).
    cap_drop:
      - ALL                               # ни одна Linux-capability не нужна веб-приложению.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks:
      - genesis

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - genesis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # На хосте 5432 и 5433 заняты другими БД → публикуем на 5434
      # (миграции EF и GUI-клиенты подключаются к localhost:5434).
      # Контейнеры между собой ходят на внутренний postgres:5432.
      # На проде хост-порт можно убрать — API общается с БД по внутренней сети.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    networks:
      - genesis

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - genesis-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # S3 API и консоль наружу не публикуем — только внутри сети.
    networks:
      - genesis

  adminer:
    image: adminer:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - postgres
    ports:
      # На хосте 8080 занят сервером другого проекта → публикуем на 8081.
      - "${ADMINER_HOST_PORT:-8081}:8080"
    networks:
      - genesis

volumes:
  genesis-postgres:
  genesis-minio:

networks:
  genesis:
    driver: bridge

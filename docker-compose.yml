# ============================================================
#  Genesis Market — локальная / VPS-инфраструктура (ПРОД).
#  Все секреты и ключи берутся из .env (см. .env.example).
#  В самом файле — ни одного значения секрета.
#
#  Для разработки используй docker-compose.dev.yml / `make dev-up` —
#  ОТДЕЛЬНЫЙ, полностью изолированный стек (см. README-dev.md).
#
#  Сетевой периметр: наружу не смотрит ни один порт. API слушает только
#  127.0.0.1 — снаружи он доступен исключительно через обратный прокси
#  (docker-compose.proxy.yml, TLS на 443) либо через туннель ngrok.
#  PostgreSQL и MinIO портов на хосте не имеют вообще: доступ к ним —
#  по внутренней docker-сети, а с рабочей машины — SSH-туннелем:
#      ssh -L 5434:127.0.0.1:5432 user@host   # но см. ниже: порта на хосте нет,
#  либо напрямую в контейнер:
#      docker exec -it genesis-postgres psql -U "$POSTGRES_USER" "$POSTGRES_DB"
# ============================================================

# Guard от случайного «голого» `docker compose up` в этой папке: без -f
# Compose по умолчанию берёт именно этот (прод) файл, а команду «up --build»
# слишком легко набрать не думая. I_CONFIRM_PROD_LAUNCH никогда не должен
# лежать в .env (файл подхватывается автоматически) — задавай его только
# прямо в команде, каждый раз заново:
#   I_CONFIRM_PROD_LAUNCH=yes docker compose up -d --build      (bash)
#   $env:I_CONFIRM_PROD_LAUNCH='yes'; docker compose up -d --build   (PowerShell)
#
# Внимание: Compose интерполирует файл на ЛЮБОЙ команде, включая `exec`, `ps`
# и `logs`. Поэтому обслуживающие скрипты (scripts/backup.sh) обращаются к
# контейнерам напрямую через `docker exec` по container_name, а не через
# `docker compose exec` — иначе guard ронял бы бэкап по расписанию.
x-guard: "${I_CONFIRM_PROD_LAUNCH:?ЭТО ПРОД. Для dev используй docker compose -f docker-compose.dev.yml up --build (или make dev-up). Если осознанно поднимаешь прод — добавь I_CONFIRM_PROD_LAUNCH=yes перед командой, каждый раз заново, не в .env.}"

# Ротация логов: без неё json-file растёт без ограничений и рано или поздно
# забивает диск — сервер встаёт целиком. 10 МБ × 5 файлов на сервис.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    container_name: genesis-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Окружение задаётся ЯВНО и обязательно: пустая строка — это не Production,
      # и приложение молча поднялось бы мимо всех production-проверок конфигурации
      # (см. Configuration/OptionsValidationSetup.cs). Отсюда `:?` вместо `:-`.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?не задан. Укажи Production (или Development/Staging) в .env — пустое значение отключает проверки конфигурации.}
      # Порт, который Kestrel слушает ВНУТРИ контейнера. По умолчанию 8080
      # (внутренняя сеть, с занятым на хосте 8080 не конфликтует).
      ASPNETCORE_HTTP_PORTS: ${ASPNETCORE_HTTP_PORTS:-8080}
      # Уровень логов Serilog из .env.
      Serilog__MinimumLevel__Default: ${LOG_LEVEL}
      # PostgreSQL. Приложению нужны только DML-права, поэтому оно ходит под
      # отдельной ролью POSTGRES_APP_USER (создаётся scripts/create-app-role.sql).
      # Пока роль не заведена — откат на POSTGRES_USER (суперпользователь образа),
      # чтобы стек не падал; это временное состояние, см. docs/server-security-log.md №11.
      Postgres__Host: postgres
      Postgres__Port: "5432"
      Postgres__Database: ${POSTGRES_DB}
      Postgres__User: ${POSTGRES_APP_USER:-${POSTGRES_USER}}
      Postgres__Password: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      # MinIO.
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET}
      Minio__UseSsl: ${MINIO_USE_SSL}
      # JWT — ключ подписи ТОЛЬКО из окружения (в appsettings его нет).
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      # Ключ HMAC для хеширования IP (сырой IP в базе не хранится).
      Security__IpHashKey: ${IPHASH_KEY}
      # SMTP для писем подтверждения. В Production пустой Smtp__Host — ошибка старта:
      # иначе код подтверждения ушёл бы в лог вместо письма (см. Auth/EmailSender.cs).
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM:-no-reply@genesis-hq.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-Genesis Market}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      # Resend (уведомления о новых обращениях формы обратной связи).
      # Домен отправителя должен быть подтверждён в панели Resend (DNS: SPF/DKIM/DMARC).
      Resend__ApiKey: ${RESEND_API_KEY}
      Resend__FromEmail: ${RESEND_FROM_EMAIL}
      Resend__NotificationEmail: ${FEEDBACK_NOTIFICATION_EMAIL:-feedback@genesis-market.com}
      # Telegram-бот (уведомления/посты через outbox). Пусто -> публикация выключена.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__BroadcastChatId: ${TELEGRAM_BROADCAST_CHAT_ID}
      # Публичный адрес фронтенда для ссылок в постах канала.
      Telegram__WebBaseUrl: ${TELEGRAM_WEB_BASE_URL}
      # Маршрутизация «категория -> канал» задаётся переменными Telegram__CategoryChannels__<category>.
      # SEO: публичный адрес сайта для канонических ссылок, sitemap, og-тегов и JSON-LD.
      # Пусто -> SEO-эндпоинты отдают 503 (индексировать нечего). Обычно = адресу фронтенда.
      Seo__WebBaseUrl: ${SEO_WEB_BASE_URL}
      Seo__SiteName: ${SEO_SITE_NAME:-Genesis Market}
      # Алиас на тот же адрес одной переменной (используется, если Seo__WebBaseUrl пуст).
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      # Что обязательно для публикации: None | Email | Phone | Both.
      Publishing__RequiredVerification: ${PUBLISHING_REQUIRED_VERIFICATION:-Email}
      # CORS — строка origin-ов через запятую.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      # Доверенные обратные прокси (Caddy как TLS-терминатор): без них RemoteIpAddress —
      # это адрес прокси, и rate-limit/журнал считали бы всех клиентов одним IP.
      # KnownNetworks — CIDR доверенных сетей (docker-мост), KnownProxies — конкретные IP.
      # Сузь до сети своего прокси, если она известна: чем шире доверие, тем проще
      # подделать X-Forwarded-For и обойти лимиты по IP.
      Network__KnownNetworks: ${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      Network__KnownProxies: ${TRUSTED_PROXY_IPS}
      Network__ForwardLimit: ${TRUSTED_PROXY_FORWARD_LIMIT:-1}
      # Защита от ботов: все публичные запросы ограничиваются по реальному IP,
      # полученному от доверенного прокси/ngrok. Меняются без пересборки образа.
      RateLimit__GlobalPerMinute: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-120}
      RateLimit__SearchPerMinute: ${RATE_LIMIT_SEARCH_PER_MINUTE:-60}
      RateLimit__SensitiveAnonPerHour: ${RATE_LIMIT_SENSITIVE_ANON_PER_HOUR:-3}
      RateLimit__CreateListingPerHour: ${RATE_LIMIT_CREATE_LISTING_PER_HOUR:-10}
      RateLimit__FeedbackAnonPerHour: ${RATE_LIMIT_FEEDBACK_ANON_PER_HOUR:-5}
      RateLimit__FeedbackUserPerHour: ${RATE_LIMIT_FEEDBACK_USER_PER_HOUR:-20}
      # Лимиты Kestrel: потолок тела запроса и заголовков, таймауты соединения.
      Kestrel__Limits__MaxRequestBodySizeBytes: ${KESTREL_MAX_BODY_BYTES:-12582912}
      Kestrel__Limits__MaxRequestHeadersTotalSizeBytes: ${KESTREL_MAX_HEADERS_BYTES:-32768}
      Kestrel__Limits__KeepAliveTimeoutSeconds: ${KESTREL_KEEPALIVE_SECONDS:-120}
      Kestrel__Limits__RequestHeadersTimeoutSeconds: ${KESTREL_HEADERS_TIMEOUT_SECONDS:-30}
      # OpenTelemetry: адрес OTLP-коллектора. Пусто -> экспорт выключен (инструментация вхолостую).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    ports:
      # ТОЛЬКО loopback. Наружу API отдаёт обратный прокси (443) или туннель ngrok,
      # который тоже подключается к 127.0.0.1. Публикация на 0.0.0.0 означала бы,
      # что прокси можно обойти, а вместе с ним — и TLS, и подсчёт лимитов по IP.
      - "127.0.0.1:${API_HOST_PORT:-8090}:${ASPNETCORE_HTTP_PORTS:-8080}"
    # ---- Hardening контейнера ----
    read_only: true                       # ФС только для чтения; писать — только в tmpfs ниже.
    tmpfs:
      - /tmp                              # .NET нужен только временный каталог.
    security_opt:
      - no-new-privileges:true            # процесс не может повысить привилегии (setuid и пр.).
    cap_drop:
      - ALL                               # ни одна Linux-capability не нужна веб-приложению.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks:
      - genesis

  postgres:
    container_name: genesis-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - genesis-postgres:/var/lib/postgresql/data
      # Скрипт создания ограниченной роли приложения — примонтирован только для
      # чтения, вручную: `docker exec -i genesis-postgres psql ... -f /sql/create-app-role.sql`.
      # В /docker-entrypoint-initdb.d НЕ кладём: там он выполнился бы лишь на
      # пустом томе и молча пропустился бы на существующей базе.
      - ./scripts/create-app-role.sql:/sql/create-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт на хосте не публикуется: снаружи БД не нужна никому. Доступ —
    # по внутренней сети (api -> postgres:5432), с рабочей машины —
    # `docker exec -it genesis-postgres psql` либо SSH-туннель до докер-сети.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      - genesis

  minio:
    container_name: genesis-minio
    # Тег закреплён по digest: у MinIO нет стабильных semver-тегов, а :latest
    # молча меняет версию при каждой пересборке. Обновление — осознанно:
    #   docker pull minio/minio:RELEASE.<дата>-cpuv1
    #   docker image inspect --format '{{index .RepoDigests 0}}' minio/minio:RELEASE.<дата>-cpuv1
    # и подставить новый digest сюда.
    #
    # Берём вариант -cpuv1 (базовый уровень x86-64): процессор прод-сервера не
    # поддерживает cpuv2, обычная сборка на нём не запускается. Понижать версию
    # при этом нельзя — формат тома MinIO движется только вперёд, и старый
    # бинарник падает на нём с «decodeXLHeaders: Unknown xl header version 3».
    # Ровно так прод и встал 2026-09-05: том писала свежая версия, а закреплён
    # был cpuv1 от января 2024-го. Оба условия разом выполняет свежий cpuv1.
    # RELEASE.2025-09-07T16-13-09Z-cpuv1
    image: minio/minio@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - genesis-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # S3 API и консоль наружу не публикуем — только внутри сети.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      - genesis

  # Adminer в проде отсутствует намеренно: веб-клиент БД, открытый в интернет, —
  # это готовый вход в базу. Он живёт только в docker-compose.dev.yml.
  # Разовый доступ к прод-базе: `docker exec -it genesis-postgres psql -U ... -d ...`.

volumes:
  genesis-postgres:
  genesis-minio:

networks:
  genesis:
    driver: bridge
